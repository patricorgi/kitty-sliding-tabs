# Include this file after your color theme in kitty.conf.
tab_bar_style custom
tab_bar_edge top
tab_bar_margin_width 6
tab_bar_margin_height 6 0
tab_bar_background #1e1e2e
active_tab_background #cba6f7
active_tab_foreground #1e1e2e
inactive_tab_background #1e1e2e
inactive_tab_foreground #cdd6f4
active_tab_font_style normal
inactive_tab_font_style normal
tab_separator ""
tab_title_template " {fmt.fg._9399b2}{index}{fmt.fg.tab} {title.replace(' │ ', '·').replace(' · ', '·')} "
active_tab_title_template " {index} {title.replace(' │ ', '·').replace(' · ', '·')} "
symbol_map U+E100-U+E101 Kitty Inset Corners
custom_shaders active-tab-slide-lite
